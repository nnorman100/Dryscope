# Firebase App Hosting settings for DryScope (project dryscope-d6f72).
# https://firebase.google.com/docs/app-hosting/configure
#
# The backend ("dryscope" in firebase.json) lives in us-central1, the same
# region as the (default) Firestore database. The region is chosen when the
# backend is created, not here.

# server.ts is a custom server (it hosts the Gemini Live voice socket at
# /api/live-ws), so we bypass App Hosting's Next.js adapter and ship the
# whole workspace, node_modules included.
scripts:
  buildCommand: npm run build
  runCommand: npm start

outputFiles:
  serverApp:
    include: [.]

runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME

  # Create once with `firebase apphosting:secrets:set gemini-api-key`
  # or in the console under App Hosting > Settings > Environment.
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
    availability:
      - RUNTIME

  # Google Maps browser key, inlined into the client bundle at build time.
  # Create once with `firebase apphosting:secrets:set maps-api-key` and grant
  # it with `firebase apphosting:secrets:grantaccess maps-api-key --backend dryscope`. Restrict the
  # key by HTTP referrer to the *.hosted.app host and any custom domain.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    secret: maps-api-key
    availability:
      - BUILD
